registry:
  rsproxy:
    name: RsProxy (ByteDance)
    description: Самый стабильный в Китае, рекомендуется для повседневной работы
  aliyun:
    name: Alibaba Cloud
    description: Резервное зеркало; индекс доступен, но загрузки могут отдавать 404
  ustc:
    name: USTC (Китайский ун-т науки и технологий)
    description: Документация ещё доступна, соединение нестабильно
  tuna:
    name: Tsinghua TUNA
    description: Документация ещё доступна, иногда не отвечает
  sjtu:
    name: SJTUG (Шанхайский ун-т Цзяо Тун)
    description: Университетское зеркало, подходит для экстренных случаев
  official:
    name: Официальный crates.io
    description: Зеркало по умолчанию; переключитесь обратно перед cargo publish

