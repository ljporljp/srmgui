registry:
  rsproxy:
    name: RsProxy (ByteDance)
    description: Most stable in China, recommended for daily use
  aliyun:
    name: Alibaba Cloud
    description: Backup source; index sometimes works but downloads may 404
  ustc:
    name: USTC
    description: Docs still online; connectivity fluctuates
  tuna:
    name: Tsinghua TUNA
    description: Docs still online; occasionally unresponsive
  sjtu:
    name: SJTUG (Shanghai Jiao Tong University)
    description: University mirror, good for emergencies
  official:
    name: Official crates.io
    description: Default source; switch back before cargo publish

