registry:
  rsproxy:
    name: RsProxy (ByteDance)
    description: In China am stabilsten, für den täglichen Einsatz empfohlen
  aliyun:
    name: Alibaba Cloud
    description: Ausweichspiegel; Index oft erreichbar, Downloads teils 404
  ustc:
    name: USTC (Uni. Wissenschaft und Technik China)
    description: Doku noch online, Verbindung schwankt
  tuna:
    name: Tsinghua TUNA
    description: Doku noch online, gelegentlich ohne Antwort
  sjtu:
    name: SJTUG (Shanghai Jiao Tong University)
    description: Universitäts-Spiegel, gut für Notfälle
  official:
    name: Offizielles crates.io
    description: Standardspiegel; vor cargo publish zurückwechseln

