registry:
  rsproxy:
    name: RsProxy (ByteDance)
    description: Le plus stable en Chine, recommandé au quotidien
  aliyun:
    name: Alibaba Cloud
    description: Miroir de secours ; l’index répond mais les téléchargements peuvent renvoyer 404
  ustc:
    name: USTC (Université de science et technologie de Chine)
    description: Documentation encore en ligne, connexion instable
  tuna:
    name: Tsinghua TUNA
    description: Documentation encore en ligne, parfois sans réponse
  sjtu:
    name: SJTUG (Université Jiao Tong de Shanghai)
    description: Miroir universitaire, utile en urgence
  official:
    name: crates.io officiel
    description: Miroir par défaut ; revenez-y avant cargo publish
