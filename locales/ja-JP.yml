registry:
  rsproxy:
    name: RsProxy（ByteDance）
    description: 中国国内で最も安定。日常利用に最適
  aliyun:
    name: Alibaba Cloud（阿里云）
    description: 予備ミラー。インデックスは通ってもダウンロードが 404 になることがある
  ustc:
    name: 中国科学技術大学 USTC
    description: ドキュメントは健在だが接続が不安定
  tuna:
    name: 清華大学 TUNA
    description: ドキュメントは健在だが応答しないことがある
  sjtu:
    name: 上海交通大学 SJTUG
    description: 大学ミラー。緊急時の利用に
  official:
    name: 公式 crates.io
    description: デフォルトのミラー。cargo publish の前に戻すことを推奨
