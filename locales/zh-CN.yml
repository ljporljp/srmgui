registry:
  rsproxy:
    name: RsProxy（字节）
    description: 国内实测最稳，推荐日常使用
  aliyun:
    name: 阿里云
    description: 备用源，偶发索引通但下载 404
  ustc:
    name: 中科大 USTC
    description: 文档仍在，连通性波动较大
  tuna:
    name: 清华 TUNA
    description: 帮助文档仍在，偶发无响应
  sjtu:
    name: 上海交大 SJTUG
    description: 高校源，适合应急
  official:
    name: 官方 crates.io
    description: 默认源，cargo publish 前建议切回

