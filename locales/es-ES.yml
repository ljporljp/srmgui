registry:
  rsproxy:
    name: RsProxy (ByteDance)
    description: El más estable en China, recomendado para el día a día
  aliyun:
    name: Alibaba Cloud
    description: Espejo de respaldo; el índice responde pero las descargas pueden dar 404
  ustc:
    name: USTC (Univ. de Ciencia y Tecnología de China)
    description: La documentación sigue en línea, la conexión es inestable
  tuna:
    name: Tsinghua TUNA
    description: La documentación sigue en línea, a veces no responde
  sjtu:
    name: SJTUG (Universidad Jiao Tong de Shanghái)
    description: Espejo universitario, útil en emergencias
  official:
    name: crates.io oficial
    description: Espejo predeterminado; vuelve a él antes de cargo publish

