[package]
name = "srmgui"
version = "1.4.1"
edition = "2024"
authors = ["liujinpeng <imljp@foxmail.com>"]
description = "GUI tool to switch Rust Cargo registry mirrors, built with GPUI Kit"
license = "MIT"
repository = "https://github.com/ljporljp/srmgui"
readme = "README.md"
keywords = ["cargo", "mirror", "registry", "gui", "gpui"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
gpui-kit = "0.9"
anyhow = "1"
toml = "0.8"
toml_edit = "0.22"
rust-i18n = "4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"

[package.metadata.deb]
maintainer = "liujinpeng <imljp@foxmail.com>"
copyright = "2026, liujinpeng"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "libc6, libgcc-s1, libfontconfig1, libfreetype6, libvulkan1, libwayland-client0, libx11-6, libxkbcommon0, libasound2"
extended-description = """
A small desktop tool to check, benchmark and switch Rust Cargo registry
mirrors. Built with GPUI Kit, it probes each mirror over TCP, HTTP index
and sparse registry config, measures download speed, and writes the chosen
mirror into ~/.cargo/config.toml (with automatic backup)."""
assets = [
    ["target/release/srmgui", "usr/bin/", "755"],
    ["packaging/linux/srmgui.desktop", "usr/share/applications/", "644"],
    ["assets/logo.png", "usr/share/icons/hicolor/512x512/apps/srmgui.png", "644"],
]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.dev]
# 只保留行号级别的调试信息，减少调试信息生成与链接耗时（仍可定位到源码行）
debug = "line-tables-only"

[profile.dev.package."*"]
# 第三方依赖不生成调试信息，显著缩短依赖编译时间
debug = false

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1