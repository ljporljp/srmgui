name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: srmgui.exe
            platform: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: srmgui
            platform: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: srmgui
            platform: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: srmgui
            platform: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libwebkit2gtk-4.1-dev libssl-dev libzstd-dev \
            libasound2-dev libvulkan-dev vulkan-validationlayers libvulkan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      # Linux 使用本机默认 target 构建，打包工具（cargo-deb / AppImage）才能直接定位产物
      - name: Build release binary
        if: matrix.os != 'ubuntu-22.04'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build release binary (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo build --release --locked

      - name: Package portable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $platform = "${{ matrix.platform }}"
          $stage = "stage/srmgui-$version-$platform"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$stage/"
          Copy-Item README.md, LICENSE "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/srmgui-$version-$platform-portable.zip" -Force

      - name: Package portable (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          version="${{ steps.ver.outputs.version }}"
          platform="${{ matrix.platform }}"
          # Linux 走本机默认 target，macOS 走交叉编译 target 目录
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            bin_path="target/release/${{ matrix.bin }}"
          else
            bin_path="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          fi
          stage="stage/srmgui-$version-$platform"
          mkdir -p "$stage" dist
          cp "$bin_path" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "dist/srmgui-$version-$platform-portable.tar.gz" -C stage "srmgui-$version-$platform"

      - name: Build installer (Windows, Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $root = (Get-Location).Path
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $iscc `
            "/DAppVersion=$version" `
            "/DSourceDir=$root" `
            "/DSourceExe=$root\target\${{ matrix.target }}\release\srmgui.exe" `
            "/DOutputDir=$root\dist" `
            "packaging\windows\srmgui.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Build installer (macOS, app bundle + dmg)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          platform="${{ matrix.platform }}"
          app="bundle/srmgui.app"
          rm -rf bundle icon.iconset
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$app/Contents/MacOS/srmgui"
          chmod +x "$app/Contents/MacOS/srmgui"

          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/logo.png --out "icon.iconset/icon_${size}x${size}.png" > /dev/null
            sips -z "$((size * 2))" "$((size * 2))" assets/logo.png --out "icon.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/AppIcon.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>srmgui</string>
            <key>CFBundleDisplayName</key><string>srmgui</string>
            <key>CFBundleIdentifier</key><string>com.ljporljp.srmgui</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleExecutable</key><string>srmgui</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Apple Silicon 上未签名的可执行文件无法直接运行，这里做 ad-hoc 签名
          codesign --force --deep --sign - "$app"
          hdiutil create -volname "srmgui" -srcfolder "$app" -ov -format UDZO \
            "dist/srmgui-$version-$platform.dmg"

      - name: Build installer (Linux, deb + AppImage)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          platform="${{ matrix.platform }}"

          cargo install cargo-deb --locked
          cargo deb --no-build
          mv target/debian/srmgui_*.deb "dist/srmgui-$version-$platform.deb"

          appdir="AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/512x512/apps"
          cp target/release/srmgui "$appdir/usr/bin/"
          cp packaging/linux/srmgui.desktop "$appdir/srmgui.desktop"
          cp packaging/linux/srmgui.desktop "$appdir/usr/share/applications/"
          cp assets/logo.png "$appdir/srmgui.png"
          cp assets/logo.png "$appdir/usr/share/icons/hicolor/512x512/apps/srmgui.png"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")"
          exec "$here/usr/bin/srmgui" "$@"
          EOF
          chmod +x "$appdir/AppRun"

          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run "$appdir" \
            "dist/srmgui-$version-$platform.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: srmgui-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and generate checksums
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.exe' \
            -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          cd dist
          sha256sum -- *.zip *.tar.gz *.exe *.dmg *.deb *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate changelog
        id: changelog
        run: |
          # 确定上一个 tag（用于截取本次发布的提交范围）
          PREV_TAG=$(git describe --tags --abbrev=0 "HEAD~1" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          echo "## 变更说明" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "本次发布包含以下改动（按类型分组）：" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

          # 按 conventional commit 类型分组输出
          for TYPE in feat fix refactor perf docs chore test ci; do
            COMMITS=$(git log --oneline --no-merges "$RANGE" 2>/dev/null | grep -iE "^[a-f0-9]+ +${TYPE}:" || true)
            if [ -n "$COMMITS" ]; then
              case "$TYPE" in
                feat) LABEL="新功能" ;;
                fix) LABEL="修复" ;;
                refactor) LABEL="重构" ;;
                perf) LABEL="性能" ;;
                docs) LABEL="文档" ;;
                chore) LABEL="杂项" ;;
                test) LABEL="测试" ;;
                ci) LABEL="构建" ;;
                *) LABEL="$TYPE" ;;
              esac
              echo "### $LABEL" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
              echo "$COMMITS" | while read -r line; do
                HASH=$(echo "$line" | awk '{print $1}')
                MSG=$(echo "$line" | cut -d' ' -f2-)
                # 去掉 conventional commit 的类型前缀
                MSG=$(echo "$MSG" | sed -E "s/^${TYPE}:? *//I")
                echo "- $MSG (\`$HASH\`)" >> CHANGELOG.md
              done
              echo "" >> CHANGELOG.md
            fi
          done

          # 未匹配到类型的提交
          OTHERS=$(git log --oneline --no-merges "$RANGE" 2>/dev/null | grep -ivE "^[a-f0-9]+ +(feat|fix|refactor|perf|docs|chore|test|ci):" || true)
          if [ -n "$OTHERS" ]; then
            echo "### 其他" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "$OTHERS" | while read -r line; do
              HASH=$(echo "$line" | awk '{print $1}')
              MSG=$(echo "$line" | cut -d' ' -f2-)
              echo "- $MSG (\`$HASH\`)" >> CHANGELOG.md
            done
            echo "" >> CHANGELOG.md
          fi

          cat CHANGELOG.md

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # 确保 tag 以 v 开头
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: srmgui ${{ steps.tag.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
