    <polygon points="789.9,456.8 819.1,344.0 695.1,389.2"/>
  </g>

  <!-- 中心立方体（Cargo 包） -->
  <polygon points="512,352 662,427 512,502 362,427" fill="#FFFFFF"/>
  <polygon points="362,427 512,502 512,672 362,597" fill="#DEE8FF"/>
  <polygon points="662,427 512,502 512,672 662,597" fill="#B2C6F5"/>
</svg>
